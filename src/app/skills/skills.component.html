<div id="skills" class="w-screen h-fit bg-slate-500 py-10">
     <h1 class="font-sans text-5xl font-bold text-center mt-14">SKILLS</h1>
   
     <!-- Front-end Section -->
     <div class="relative w-full mt-10 text-center">
       <h1 class="text-3xl font-bold">Front-end</h1>
       <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 mt-8">
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="p-2" src="html.jpg" alt="HTML">
           <p class="text-2xl">HTML</p>
         </div>
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-3" src="css.png" alt="CSS">
           <p class="mt-1 text-2xl">CSS</p>
         </div>
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-2" src="JS.png" alt="JavaScript">
           <p class="mt-1 text-2xl">JavaScript</p>
         </div>
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-2" src="angular.png" alt="Angular">
           <p class="mt-1 text-2xl">Angular</p>
         </div>
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-2" src="twcss.png" alt="Tailwind CSS">
           <p class="mt-1 text-2xl">Tailwind CSS</p>
         </div>
       </div>
     </div>
   
     <!-- Back-end Section -->
     <div class="relative w-full mt-10 text-center">
       <h1 class="text-3xl font-bold">Back-end</h1>
       <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-8">
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="p-2" src="java.png" alt="Java">
           <p class="text-2xl">Java</p>
         </div>
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-2" src="firebase.png" alt="Firebase">
           <p class="mt-1 text-2xl">Firebase</p>
         </div>
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-2" src="python.png" alt="Python">
           <p class="mt-1 text-2xl">Python</p>
         </div>
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-2" src="mysql.png" alt="MySQL">
           <p class="mt-1 text-2xl">MySQL</p>
         </div>
       </div>
     </div>
   
     <!-- Others Section -->
     <div class="relative w-full mt-10 text-center">
       <h1 class="text-3xl font-bold">Others</h1>
       <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-8 mb-14">
         <div [class.scale-up-center]="true" class="w-44 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="p-2" src="Android_Studio.png" alt="Android Studio">
           <p class="text-2xl">Android Studio</p>
         </div>
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-2" src="GitHub.png" alt="GitHub">
           <p class="mt-1 text-2xl">GitHub</p>
         </div>
         <div [class.scale-up-center]="true" class="w-40 h-56 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-2" src="visual-studio.jpg" alt="Visual Studio">
           <p class="mt-1 text-2xl">Visual Studio</p>
         </div>
         <div [class.scale-up-center]="true" class="w-44 h-60 mx-auto bg-white rounded-xl drop-shadow-3xl">
           <img class="w-full h-40 p-2" src="photoshop.png" alt="Adobe Photoshop">
           <p class="mt-1 text-2xl">Adobe Photoshop</p>
         </div>
       </div>
     </div>
   </div>
