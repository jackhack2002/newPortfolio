<div id="contact" class="flex flex-col w-full bg-slate-500 pt-28 pb-10">
     <!-- Section Title -->
     <div class="flex w-full" [class.bounce-in-right]="true">
       <h1 class="mx-auto text-3xl font-bold text-white underline">CONTACT</h1>
     </div>
   
     <!-- Contact Form Container -->
     <div class="w-11/12 mx-auto mt-10 bg-gray-400 border-2 border-purple-400 shadow-2xl rounded-3xl shadow-purple-500 lg:w-2/3" [class.puff-in-center]="true">
       <form action="https://formsubmit.co/jacobjabakumar2002@gmail.com" method="POST" class="p-8 lg:px-16">
         <!-- Name Field -->
         <div class="mb-6">
           <label for="name" class="block mb-2 text-lg font-medium text-gray-800">Name</label>
           <input 
             type="text" 
             name="name" 
             id="name" 
             class="block w-full px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400" 
             placeholder="Enter your name" 
             required />
         </div>
   
         <!-- Email Field -->
         <div class="mb-6">
           <label for="email" class="block mb-2 text-lg font-medium text-gray-800">Email Address</label>
           <input 
             type="email" 
             name="email" 
             id="email" 
             class="block w-full px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400" 
             placeholder="Enter your email" 
             required />
         </div>
   
         <!-- Message Field -->
         <div class="mb-6">
           <label for="message" class="block mb-2 text-lg font-medium text-gray-800">Message</label>
           <textarea 
             name="message" 
             id="message" 
             rows="4" 
             class="block w-full px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400" 
             placeholder="Enter your message" 
             required></textarea>
         </div>
   
         <!-- Submit Button -->
         <div>
           <button 
             type="submit" 
             class="w-full px-6 py-2.5 bg-purple-600 text-white font-medium text-lg uppercase rounded-lg shadow-md hover:bg-purple-700 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-purple-400 active:bg-purple-800 transition ease-in-out duration-150">
             Send
           </button>
         </div>
       </form>
     </div>
   </div>
